<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — HealthSense AI</title>
  <link rel="stylesheet" href="../style.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Background glow blobs */
    .auth-glow-1 {
      position: fixed; top: -180px; left: -120px;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(79,142,247,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .auth-glow-2 {
      position: fixed; bottom: -200px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse, rgba(124,92,216,0.1) 0%, transparent 65%);
      pointer-events: none;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .auth-logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cd8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #fff;
    }
    .auth-logo-text {
      font-size: 18px; font-weight: 800; color: var(--text);
    }
    .auth-logo-text span { color: var(--accent); }

    .auth-tabs {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .auth-form { display: flex; flex-direction: column; gap: 14px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--muted); }

    .input-with-icon {
      position: relative;
    }
    .input-with-icon .form-input { padding-left: 40px; }
    .input-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      font-size: 15px; color: var(--muted);
      pointer-events: none;
    }
    .input-eye {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      font-size: 15px; color: var(--muted);
      cursor: pointer; user-select: none;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .role-btn {
      padding: 12px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
    }
    .role-btn .role-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    .role-btn.selected {
      border-color: var(--accent);
      background: rgba(79,142,247,0.1);
      color: var(--accent);
    }

    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 4px 0;
      font-size: 12px; color: var(--muted);
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color 0.2s;
    }
    .btn-google:hover { border-color: var(--accent); }

    .btn-auth {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cd8);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      transition: opacity 0.2s;
      position: relative;
    }
    .btn-auth:hover { opacity: 0.92; }
    .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.7;
    }
    .auth-footer-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .auth-error {
      display: none;
      padding: 10px 14px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      font-size: 12px;
      color: #ef4444;
    }

    /* Spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Security badges */
    .security-badges {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }
    .sec-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
<div class="auth-glow-1"></div>
<div class="auth-glow-2"></div>

<div class="auth-card">

  <!-- Logo -->
  <a href="../index.html" class="auth-logo">
    <div class="auth-logo-icon">H</div>
    <div class="auth-logo-text">Health<span>Sense</span> AI</div>
  </a>

  <!-- Tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
    <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Error box -->
  <div class="auth-error" id="auth-error"></div>

  <!-- ══ LOGIN FORM ══ -->
  <div id="form-login">
    <div class="auth-form">
      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <div class="input-with-icon">
          <span class="input-icon">✉</span>
          <input id="login-email" type="email" class="form-input" placeholder="you@example.com" autocomplete="email"/>
        </div>
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label class="form-label">PASSWORD</label>
          <a href="#" onclick="showForgot();return false;" style="font-size:11px;color:var(--accent);text-decoration:none;">Forgot password?</a>
        </div>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input id="login-pass" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password"/>
          <span class="input-eye" onclick="togglePwd('login-pass',this)">👁</span>
        </div>
      </div>

      <div class="auth-divider">or continue with</div>

      <button class="btn-google" onclick="googleAuth()">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>

      <button class="btn-auth" id="login-btn" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- ══ SIGNUP FORM ══ -->
  <div id="form-signup" style="display:none;">
    <div class="auth-form">
      <div class="form-group">
        <label class="form-label">FULL NAME</label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input id="signup-name" type="text" class="form-input" placeholder="Dr. Ananya Sharma" autocomplete="name"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <div class="input-with-icon">
          <span class="input-icon">✉</span>
          <input id="signup-email" type="email" class="form-input" placeholder="you@example.com" autocomplete="email"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input id="signup-pass" type="password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password"/>
          <span class="input-eye" onclick="togglePwd('signup-pass',this)">👁</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">I AM A</label>
        <div class="role-selector">
          <button class="role-btn selected" id="role-patient" onclick="selectRole('patient')">
            <span class="role-icon">🏥</span>Patient
          </button>
          <button class="role-btn" id="role-doctor" onclick="selectRole('doctor')">
            <span class="role-icon">👨‍⚕️</span>Doctor
          </button>
        </div>
      </div>

      <button class="btn-auth" id="signup-btn" onclick="handleSignup()">Create Account</button>

      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.6;">
        By signing up you agree to our <a href="#" style="color:var(--accent);text-decoration:none;">Terms of Service</a> and <a href="#" style="color:var(--accent);text-decoration:none;">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <!-- Security badges -->
  <div class="security-badges">
    <div class="sec-badge">🔐 256-bit SSL</div>
    <div class="sec-badge">🛡 HIPAA Ready</div>
    <div class="sec-badge">✅ DPDP Act</div>
  </div>

</div>

<script>
  let selectedRole = 'patient';

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
    document.getElementById('form-signup').style.display = isLogin ? 'none' : 'block';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-signup').classList.toggle('active', !isLogin);
    hideError();
  }

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('role-patient').classList.toggle('selected', role === 'patient');
    document.getElementById('role-doctor').classList.toggle('selected', role === 'doctor');
  }

  function togglePwd(id, el) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; el.textContent = '🙈'; }
    else { inp.type = 'password'; el.textContent = '👁'; }
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('auth-error').style.display = 'none';
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span>' : btn.dataset.label;
  }

  // Store default labels
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-btn').dataset.label = 'Sign In';
    document.getElementById('signup-btn').dataset.label = 'Create Account';
  });

  function validateEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  async function handleLogin() {
    hideError();
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;

    if (!email || !validateEmail(email)) { showError('Please enter a valid email address.'); return; }
    if (!pass || pass.length < 6)        { showError('Password must be at least 6 characters.'); return; }

    setLoading('login-btn', true);

    // Demo: simulate API call (replace with real Supabase auth)
    await new Promise(r => setTimeout(r, 1200));

    // Demo credentials for showcase
    if (email === 'doctor@demo.com') {
      window.location.href = 'doctor-dashboard.html';
    } else {
      window.location.href = 'patient-dashboard.html';
    }
  }

  async function handleSignup() {
    hideError();
    const name  = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-pass').value;

    if (!name)                           { showError('Please enter your full name.'); return; }
    if (!email || !validateEmail(email)) { showError('Please enter a valid email address.'); return; }
    if (!pass || pass.length < 8)        { showError('Password must be at least 8 characters.'); return; }

    setLoading('signup-btn', true);

    // Demo: simulate API call
    await new Promise(r => setTimeout(r, 1400));

    if (selectedRole === 'doctor') {
      window.location.href = 'doctor-dashboard.html';
    } else {
      window.location.href = 'patient-dashboard.html';
    }
  }

  function googleAuth() {
    // In production: integrate Supabase Google OAuth
    // supabase.auth.signInWithOAuth({ provider: 'google' })
    showError('Google sign-in requires backend setup. Use email login for demo.');
  }

  function showForgot() {
    showError('Password reset email will be sent if the account exists. (Backend required for live version)');
  }

  // Enter key support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const loginVisible = document.getElementById('form-login').style.display !== 'none';
      if (loginVisible) handleLogin();
      else handleSignup();
    }
  });
</script>
</body>
</html>
