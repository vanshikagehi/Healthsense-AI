# render.yaml — Render.com deployment config
# Deploys BOTH frontend (static) + backend (web service)
# Blueprint method: New+ → Blueprint → connect GitHub repo

services:

  # ── BACKEND — FastAPI Web Service ──
  - type: web
    name: healthsense-ai-backend
    runtime: python
    buildCommand: >
      pip install -r backend/requirements.txt &&
      python -c "import os; os.path.exists('backend/models/model.pkl') or __import__('subprocess').run(['python','backend/train_advanced.py'],check=True)"
    startCommand: gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://healthsense-ai-frontend.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "200"
    healthCheckPath: /health
    # Free tier: 512MB RAM — enough for demo + moderate traffic
    # Upgrade to $7/month Starter plan for 20K+ concurrent users

  # ── FRONTEND — Static Site ──
  - type: web
    name: healthsense-ai-frontend
    runtime: static
    buildCommand: echo "Static site — no build step needed"
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /pages/*
        destination: /pages/:splat
      - type: rewrite
        source: /js/*
        destination: /js/:splat
      - type: rewrite
        source: /assets/*
        destination: /assets/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /style.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
