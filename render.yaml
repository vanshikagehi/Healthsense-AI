# render.yaml — Render.com deployment config
# Deploys BOTH frontend (static) + backend (web service)
# Blueprint method: New+ → Blueprint → connect GitHub repo
#
# IMPORTANT: model.pkl is pre-trained and committed to repo.
# Training does NOT run on deploy — it only trains if model is missing.
# To retrain fast (~1-2 min): run `python backend/train_fast.py` locally, commit model files.
# To retrain full ensemble (~5-10 min): run `python backend/train_advanced.py` locally.

services:

  # ── BACKEND — FastAPI Web Service ──
  - type: web
    name: healthsense-ai-backend
    runtime: python
    # Build: install deps + only train if model.pkl is missing (avoids 10-min timeout)
    # model.pkl is pre-trained locally (LightGBM 98.20%) and committed via Git LFS
    # No training on Render = no OOM, fast startup
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://healthsense-ai-frontend.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "200"
    healthCheckPath: /health
    # Free tier: 512MB RAM
    # ⚠️ If model.pkl > 200MB after training, upgrade to Render Starter ($7/mo) for 1GB RAM

  # ── FRONTEND — Static Site ──
  - type: web
    name: healthsense-ai-frontend
    runtime: static
    buildCommand: echo "Static site — no build step needed"
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /pages/*
        destination: /pages/:splat
      - type: rewrite
        source: /js/*
        destination: /js/:splat
      - type: rewrite
        source: /assets/*
        destination: /assets/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /style.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
